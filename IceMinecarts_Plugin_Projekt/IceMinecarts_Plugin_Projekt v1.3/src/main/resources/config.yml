# Größe der Wagen (1.0 = ein Wagen ist genau 1 Block lang)
scale: 1.0

# Modell nach oben (+) oder unten (-) schieben, in Blöcken
y-offset: 0.0

# Dreht die Wagen, falls die Nase in die falsche Richtung zeigt.
# Zeigt die Nase nach hinten statt nach vorn: auf 180 stellen.
yaw-offset: 0.0

# Welches Modell welche Minecart-Art bekommt: front, middle, end oder vanilla
# (vanilla = normales Minecart-Aussehen). Nicht aufgeführte Arten (Trichter,
# TNT, Spawner, Befehlsblock) bleiben normale Minecarts.
car-models:
  furnace_minecart: front
  minecart: middle
  chest_minecart: end

# Block im Minecart (Kiste, Ofen) ausblenden
hide-blocks: true

# Reinsetzen: Rechtsklick auf einen ICE-Wagen setzt dich hinein.
# Schleichen + Rechtsklick öffnet wie gewohnt die Kiste bzw. befüllt den Ofen.
seats-enabled: true

# Automatisches Verbinden: Wagen, die sich berühren, fahren als Zug zusammen.
# Der Ofen-Minecart (Front) zieht, die anderen folgen.
coupling:
  enabled: true
  connect-distance: 1.35   # ab diesem Abstand verbinden sich Wagen
  follow-distance: 1.0     # Abstand, den die Wagen halten
  break-distance: 3.0      # reißt die Verbindung, wenn der Abstand größer wird
  pull: 0.5
  max-speed: 0.4
