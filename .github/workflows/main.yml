name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: |
          POM=$(find . -name pom.xml -path '*v1.3*' | head -n 1)
          echo "Baue: $POM"
          mvn -B package -f "$POM"
      - uses: actions/upload-artifact@v4
        with:
          name: IceMinecarts
          path: '**/target/IceMinecarts.jar'
